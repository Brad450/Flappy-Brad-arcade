<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Brad Arcade — Neon Dodge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>🎮 Flappy Brad Arcade: Neon Dodge</h1>
    <p class="subtitle">Use ← → (or A/D) to dodge falling glitches. Survive as long as you can.</p>
    <canvas id="game" width="520" height="680" aria-label="Neon Dodge game"></canvas>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
      <button id="restart">Restart</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
